[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ads"
version = "0.0.3"
description = "Agent-Didactic Spaces (ADS) prototype skeleton (v2)"
readme = "README.md"
requires-python = ">=3.10"
# Core: minimal dependencies for API server
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.23",
  "pydantic>=2.4",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.5"]
# Experiment + reporting stack
exp = [
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "requests>=2.31",
  "pdfplumber>=0.10",
  "POT>=0.9",
  "ruptures>=1.1",
]
# Optional embedding runtime (downloads models on first use)
embed = ["sentence-transformers>=2.2", "torch>=2.0"]

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages", "experiments"]

[tool.ruff]
line-length = 100
