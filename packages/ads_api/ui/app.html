<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADS — Agent-Didactic Spaces</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <style>
    :root {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --text: #f1f5f9; --text2: #94a3b8; --text3: #64748b;
      --accent: #3b82f6; --accent2: #2563eb; --green: #22c55e;
      --red: #ef4444; --yellow: #eab308; --purple: #a855f7;
      --orange: #f97316; --cyan: #06b6d4;
      --border: #334155; --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; }
    .app-shell { display: flex; height: 100vh; }
    /* Sidebar */
    .sidebar { width: 220px; background: var(--bg2); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-brand { padding: 20px 16px; border-bottom: 1px solid var(--border); }
    .sidebar-brand h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; }
    .sidebar-brand small { font-size: 0.7rem; color: var(--text3); }
    .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: var(--radius); cursor: pointer; font-size: 0.85rem;
      color: var(--text2); transition: all 0.15s; margin-bottom: 2px; border: none;
      background: none; width: 100%; text-align: left; }
    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item.active { background: var(--accent); color: #fff; }
    .nav-icon { width: 18px; text-align: center; font-size: 0.9rem; }
    .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border);
      font-size: 0.7rem; color: var(--text3); }
    /* Main */
    .main { flex: 1; overflow-y: auto; }
    .topbar { padding: 16px 24px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; }
    .topbar h2 { font-size: 1.15rem; font-weight: 600; }
    .topbar-meta { font-size: 0.75rem; color: var(--text3); }
    .content { padding: 24px; }
    /* Cards */
    .card { background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .card-title { font-size: 0.85rem; font-weight: 600; color: var(--text2);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    /* Metric grid */
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .metric { background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; text-align: center; }
    .metric-value { font-size: 1.8rem; font-weight: 700; }
    .metric-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
    .metric-value.green { color: var(--green); }
    .metric-value.blue { color: var(--accent); }
    .metric-value.yellow { color: var(--yellow); }
    .metric-value.red { color: var(--red); }
    .metric-value.purple { color: var(--purple); }
    .metric-value.orange { color: var(--orange); }
    .metric-value.cyan { color: var(--cyan); }
    /* Table */
    .tbl { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .tbl th { text-align: left; padding: 8px 12px; color: var(--text3);
      font-weight: 600; border-bottom: 1px solid var(--border); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.5px; }
    .tbl td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .tbl tr:hover { background: var(--bg3); }
    .tbl .mono { font-family: 'SF Mono', Monaco, monospace; font-size: 0.75rem; }
    /* Tags */
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 0.7rem; font-weight: 600; }
    .tag-pareto { background: rgba(34,197,94,0.15); color: var(--green); }
    .tag-feasible { background: rgba(59,130,246,0.15); color: var(--accent); }
    .tag-infeasible { background: rgba(239,68,68,0.15); color: var(--red); }
    .tag-new { background: rgba(34,197,94,0.15); color: var(--green); }
    .tag-modified { background: rgba(249,115,22,0.15); color: var(--orange); }
    .tag-stable { background: rgba(100,116,139,0.15); color: var(--text3); }
    .tag-removed { background: rgba(239,68,68,0.15); color: var(--red); }
    /* Controls */
    .control-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
    .ctrl-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
    select, input[type="number"] { background: var(--bg3); color: var(--text); border: 1px solid var(--border);
      border-radius: 4px; padding: 6px 10px; font-size: 0.8rem; }
    input[type="range"] { width: 140px; accent-color: var(--accent); }
    .btn { padding: 8px 16px; border-radius: 4px; border: none; font-size: 0.8rem;
      font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Checkbox group */
    .check-group { display: flex; gap: 12px; flex-wrap: wrap; }
    .check-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
    .check-item input { accent-color: var(--accent); }
    /* Chart container */
    .chart-box { width: 100%; min-height: 380px; }
    /* Subtabs */
    .subtabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .subtab { padding: 6px 14px; border-radius: 4px; border: 1px solid var(--border);
      background: none; color: var(--text2); font-size: 0.8rem; cursor: pointer; }
    .subtab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    /* Competency bars */
    .comp-bar-wrap { margin-bottom: 8px; }
    .comp-bar-label { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 2px; }
    .comp-bar-track { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
    .comp-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    /* Loading */
    .loading { text-align: center; padding: 40px; color: var(--text3); }
    /* Graph containers */
    .cy-container { width: 100%; height: 520px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); }
    .cy-container-large { height: 600px; }
    .graph-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: 0.75rem; color: var(--text2); }
    .graph-legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
    .node-info { margin-top: 12px; padding: 12px; background: var(--bg3); border-radius: var(--radius); font-size: 0.8rem; }
    /* Info panel for graph views */
    .info-panel { background: var(--bg2); border: 1px solid var(--accent); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
    .info-panel h4 { font-size: 0.9rem; margin-bottom: 8px; color: var(--accent); }
    .info-panel p { font-size: 0.8rem; color: var(--text2); margin-bottom: 4px; }
    .info-panel .mono { font-family: 'SF Mono', Monaco, monospace; font-size: 0.75rem; }
    .course-list { max-height: 200px; overflow-y: auto; }
    .course-list-item { padding: 4px 8px; font-size: 0.75rem; border-bottom: 1px solid var(--border); }
    .course-list-item:hover { background: var(--bg3); }
    /* Two-column layout for graph + panel */
    .graph-with-panel { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
    .graph-with-panel.no-panel { grid-template-columns: 1fr; }
    /* Year toggle */
    .year-toggle { display: flex; gap: 4px; }
    .year-btn { padding: 4px 12px; border-radius: 4px; border: 1px solid var(--border);
      background: none; color: var(--text2); font-size: 0.75rem; cursor: pointer; }
    .year-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 60px; }
      .sidebar-brand small, .nav-label, .sidebar-footer { display: none; }
      .sidebar-brand h1 { font-size: 0.8rem; }
      .metric-grid { grid-template-columns: repeat(2, 1fr); }
      .graph-with-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="app">
  <div class="app-shell">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-brand">
        <h1>ADS</h1>
        <small>Agent-Didactic Spaces</small>
      </div>
      <div class="sidebar-nav">
        <button v-for="tab in tabs" :key="tab.id"
          class="nav-item" :class="{ active: currentTab === tab.id }"
          @click="currentTab = tab.id">
          <span class="nav-icon" v-text="tab.icon"></span>
          <span class="nav-label" v-text="tab.label"></span>
        </button>
      </div>
      <div class="sidebar-footer">
        v0.3.0 | MISIS Data
      </div>
    </nav>

    <!-- Main content -->
    <div class="main">
      <div class="topbar">
        <h2 v-text="activeTab.label"></h2>
        <span class="topbar-meta" v-text="'API: ' + apiStatus"></span>
      </div>
      <div class="content">

        <!-- ==================== DASHBOARD ==================== -->
        <template v-if="currentTab === 'dashboard'">
          <div v-if="!dashStats" class="loading">Loading stats...</div>
          <template v-if="dashStats">
            <div class="metric-grid">
              <div class="metric">
                <div class="metric-value blue" v-text="dashStats.total_courses"></div>
                <div class="metric-label">Courses</div>
              </div>
              <div class="metric">
                <div class="metric-value green" v-text="dashStats.total_programs"></div>
                <div class="metric-label">FGOS Programs</div>
              </div>
              <div class="metric">
                <div class="metric-value purple" v-text="dashStats.total_competencies.toLocaleString()"></div>
                <div class="metric-label">Competency Mappings</div>
              </div>
              <div class="metric">
                <div class="metric-value yellow" v-text="dashStats.total_prereq_edges.toLocaleString()"></div>
                <div class="metric-label">Prerequisite Edges</div>
              </div>
              <div class="metric">
                <div class="metric-value cyan" v-text="dashStats.years.length"></div>
                <div class="metric-label">Academic Years</div>
              </div>
              <div class="metric">
                <div class="metric-value orange" v-text="dashStats.shared_across_programs"></div>
                <div class="metric-label">Shared Courses</div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
              <div class="card">
                <div class="card-title">Competency Type Distribution</div>
                <div id="dash-comp-chart" class="chart-box" style="min-height:300px"></div>
              </div>
              <div class="card">
                <div class="card-title">Programs by Course Count</div>
                <div id="dash-programs-chart" class="chart-box" style="min-height:300px"></div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
              <div class="card">
                <div class="card-title">Courses per Year</div>
                <div id="dash-year-chart" class="chart-box" style="min-height:280px"></div>
              </div>
              <div class="card">
                <div class="card-title">Temporal Changes</div>
                <div id="dash-temporal-chart" class="chart-box" style="min-height:280px"></div>
              </div>
            </div>
          </template>
        </template>

        <!-- ==================== PROGRAM NETWORK ==================== -->
        <template v-if="currentTab === 'network'">
          <div class="card">
            <div class="card-title">Cross-Program Network</div>
            <p style="font-size:0.8rem;color:var(--text2);margin-bottom:12px">
              Each node is an FGOS program. Edges connect programs that share courses.
              Node size = course count. Edge thickness = shared course count.
            </p>
            <div class="control-row">
              <div class="ctrl-group">
                <div class="ctrl-label">Year Filter</div>
                <div class="year-toggle">
                  <button class="year-btn" :class="{ active: networkYear === '' }" @click="networkYear = ''; loadNetwork()">All</button>
                  <button v-for="y in networkYears" :key="y" class="year-btn"
                    :class="{ active: networkYear === y }"
                    @click="networkYear = y; loadNetwork()" v-text="y"></button>
                </div>
              </div>
              <div class="ctrl-group">
                <div class="ctrl-label">Layout</div>
                <select v-model="networkLayout" @change="applyNetworkLayout">
                  <option value="cose">Force-directed</option>
                  <option value="circle">Circle</option>
                  <option value="concentric">Concentric</option>
                </select>
              </div>
            </div>
          </div>

          <template v-if="networkStats">
            <div class="metric-grid">
              <div class="metric">
                <div class="metric-value blue" v-text="networkStats.programs"></div>
                <div class="metric-label">Programs</div>
              </div>
              <div class="metric">
                <div class="metric-value green" v-text="networkStats.edges"></div>
                <div class="metric-label">Connections</div>
              </div>
            </div>
          </template>

          <div class="card">
            <div :class="['graph-with-panel', networkSelectedProgram ? '' : 'no-panel']">
              <div>
                <div id="cy-network" class="cy-container cy-container-large"></div>
                <div class="graph-legend">
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#3b82f6"></div>01.xx (Math/CS)</div>
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#22c55e"></div>03.xx (Physics)</div>
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#a855f7"></div>09.xx (CS/IT)</div>
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#eab308"></div>11.xx (Electronics)</div>
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#ef4444"></div>13.xx (Energy)</div>
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#06b6d4"></div>Other</div>
                </div>
              </div>
              <div v-if="networkSelectedProgram" class="info-panel">
                <h4 v-text="networkSelectedProgram.id"></h4>
                <p><strong>Courses:</strong> <span class="mono" v-text="networkSelectedProgram.course_count"></span></p>
                <p><strong>Area:</strong> <span v-text="networkSelectedProgram.area_prefix + '.xx'"></span></p>
                <p><strong>Years:</strong> <span v-text="(networkSelectedProgram.years || []).join(', ')"></span></p>
                <template v-if="networkSelectedEdges.length > 0">
                  <p style="margin-top:8px"><strong>Shared with:</strong></p>
                  <div class="course-list">
                    <div v-for="e in networkSelectedEdges" :key="e.target" class="course-list-item">
                      <span v-text="e.target"></span>
                      <span class="mono" style="float:right" v-text="e.shared_count + ' courses'"></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>

        <!-- ==================== COURSE DAG ==================== -->
        <template v-if="currentTab === 'dag'">
          <div class="card">
            <div class="card-title">Course Prerequisite DAG</div>
            <p style="font-size:0.8rem;color:var(--text2);margin-bottom:12px">
              Per-program prerequisite graph. Enable "Compare years" to see temporal changes
              (green=new, orange=modified, gray=stable, red=removed).
            </p>
            <div class="control-row">
              <div class="ctrl-group">
                <div class="ctrl-label">FGOS Program</div>
                <select v-model="dagProgram" @change="loadDag">
                  <option value="">Select program...</option>
                  <option v-for="p in dagPrograms" :key="p.fgos_code"
                    :value="p.fgos_code"
                    v-text="p.fgos_code + ' (' + p.edge_count + ' edges)'"></option>
                </select>
              </div>
              <div class="ctrl-group">
                <div class="ctrl-label">Mode</div>
                <div class="year-toggle">
                  <button class="year-btn" :class="{ active: !dagCompare }"
                    @click="dagCompare = false; loadDag()">Single Year</button>
                  <button class="year-btn" :class="{ active: dagCompare }"
                    @click="dagCompare = true; loadDag()">Compare Years</button>
                </div>
              </div>
              <template v-if="!dagCompare">
                <div class="ctrl-group">
                  <div class="ctrl-label">Year</div>
                  <select v-model="dagYear" @change="loadDag">
                    <option value="">All years</option>
                    <option v-for="y in dagYears" :key="y" :value="y" v-text="y"></option>
                  </select>
                </div>
              </template>
              <template v-if="dagCompare">
                <div class="ctrl-group">
                  <div class="ctrl-label">Base Year</div>
                  <select v-model="dagYearA" @change="loadDag">
                    <option v-for="y in dagYears" :key="y" :value="y" v-text="y"></option>
                  </select>
                </div>
                <div class="ctrl-group">
                  <div class="ctrl-label">Compare To</div>
                  <select v-model="dagYearB" @change="loadDag">
                    <option v-for="y in dagYears" :key="y" :value="y" v-text="y"></option>
                  </select>
                </div>
              </template>
              <div class="ctrl-group">
                <div class="ctrl-label">Layout</div>
                <select v-model="dagLayout" @change="applyDagLayout">
                  <option value="dagre">Hierarchical (dagre)</option>
                  <option value="breadthfirst">Breadth-first</option>
                  <option value="cose">Force-directed</option>
                </select>
              </div>
            </div>
          </div>

          <template v-if="dagStats">
            <div class="metric-grid">
              <div class="metric">
                <div class="metric-value blue" v-text="dagStats.nodes"></div>
                <div class="metric-label">Courses</div>
              </div>
              <div class="metric">
                <div class="metric-value green" v-text="dagStats.edges"></div>
                <div class="metric-label">Prerequisites</div>
              </div>
              <template v-if="dagCompare && dagStats.changes">
                <div class="metric">
                  <div class="metric-value green" v-text="dagStats.changes.new || 0"></div>
                  <div class="metric-label">New</div>
                </div>
                <div class="metric">
                  <div class="metric-value orange" v-text="dagStats.changes.modified || 0"></div>
                  <div class="metric-label">Modified</div>
                </div>
                <div class="metric">
                  <div class="metric-value red" v-text="dagStats.changes.removed || 0"></div>
                  <div class="metric-label">Removed</div>
                </div>
              </template>
              <template v-if="!dagCompare">
                <div class="metric">
                  <div class="metric-value yellow" v-text="dagStats.roots || 0"></div>
                  <div class="metric-label">Foundation (no prereqs)</div>
                </div>
                <div class="metric">
                  <div class="metric-value purple" v-text="dagStats.leaves || 0"></div>
                  <div class="metric-label">Terminal (no dependants)</div>
                </div>
              </template>
            </div>
          </template>

          <div class="card">
            <div :class="['graph-with-panel', dagSelectedNode ? '' : 'no-panel']">
              <div>
                <div id="cy-dag" class="cy-container cy-container-large"></div>
                <div class="graph-legend" v-if="!dagCompare">
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#22c55e"></div>Foundation (no prereqs)</div>
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Intermediate</div>
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#a855f7"></div>Terminal (no dependants)</div>
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#eab308"></div>Hub (high connectivity)</div>
                </div>
                <div class="graph-legend" v-if="dagCompare">
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#22c55e"></div>New</div>
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#f97316"></div>Modified</div>
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#64748b"></div>Stable</div>
                  <div class="graph-legend-item"><div class="legend-dot" style="background:#ef4444"></div>Removed</div>
                </div>
              </div>
              <div v-if="dagSelectedNode" class="info-panel">
                <h4 v-text="dagSelectedNode.label"></h4>
                <p><strong>Prerequisites:</strong> <span class="mono" v-text="dagSelectedNode.in_degree"></span></p>
                <p><strong>Dependants:</strong> <span class="mono" v-text="dagSelectedNode.out_degree"></span></p>
                <p v-if="dagSelectedNode.change_type"><strong>Change:</strong>
                  <span class="tag" :class="'tag-' + dagSelectedNode.change_type" v-text="dagSelectedNode.change_type"></span>
                </p>
                <p><strong>Role:</strong>
                  <span v-if="dagSelectedNode.is_root" style="color:var(--green)">Foundation</span>
                  <span v-else-if="dagSelectedNode.is_leaf" style="color:var(--purple)">Terminal</span>
                  <span v-else style="color:var(--accent)">Intermediate</span>
                </p>
              </div>
            </div>
          </div>
        </template>

        <!-- ==================== PARETO EXPLORER ==================== -->
        <template v-if="currentTab === 'pareto'">
          <div class="card">
            <div class="card-title">Configuration</div>
            <div class="control-row">
              <div class="ctrl-group">
                <span class="ctrl-label">Objectives</span>
                <div class="check-group">
                  <label class="check-item" v-for="obj in objectiveOptions" :key="obj">
                    <input type="checkbox" :value="obj" v-model="paretoConfig.objectives">
                    <span v-text="obj"></span>
                  </label>
                </div>
              </div>
              <div class="ctrl-group">
                <span class="ctrl-label">Tau: {{ paretoConfig.tau.toFixed(2) }}</span>
                <input type="range" min="0" max="1" step="0.05" v-model.number="paretoConfig.tau">
              </div>
              <div class="ctrl-group">
                <span class="ctrl-label">Lens</span>
                <select v-model="paretoConfig.lens">
                  <option value="identity">Identity</option>
                  <option value="diagonal">Diagonal</option>
                </select>
              </div>
              <div class="ctrl-group">
                <span class="ctrl-label">Embedding</span>
                <select v-model="paretoConfig.embedding">
                  <option value="stub">Stub (fast)</option>
                  <option value="sbert">SBERT</option>
                </select>
              </div>
              <button class="btn btn-primary" @click="loadPareto" :disabled="paretoLoading">
                {{ paretoLoading ? 'Loading...' : 'Compute Pareto' }}
              </button>
            </div>
          </div>

          <div class="metric-grid" v-if="paretoData">
            <div class="metric">
              <div class="metric-value blue" v-text="paretoData.stats.total_options"></div>
              <div class="metric-label">Options</div>
            </div>
            <div class="metric">
              <div class="metric-value green" v-text="paretoData.stats.pareto_count"></div>
              <div class="metric-label">Pareto</div>
            </div>
            <div class="metric">
              <div class="metric-value yellow" v-text="paretoData.stats.feasible_count"></div>
              <div class="metric-label">Feasible</div>
            </div>
            <div class="metric">
              <div class="metric-value red" v-text="paretoData.stats.infeasible_count"></div>
              <div class="metric-label">Infeasible</div>
            </div>
          </div>

          <div class="card" v-if="paretoData">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
              <div class="card-title" style="margin-bottom:0">Pareto Front</div>
              <div class="subtabs" style="margin-bottom:0">
                <button class="subtab" :class="{ active: paretoView === '2d' }" @click="paretoView = '2d'; renderParetoChart()">2D</button>
                <button class="subtab" :class="{ active: paretoView === '3d' }" @click="paretoView = '3d'; renderParetoChart()" :disabled="paretoData.objective_keys.length < 3">3D</button>
                <button class="subtab" :class="{ active: paretoView === 'parallel' }" @click="paretoView = 'parallel'; renderParetoChart()">Parallel</button>
              </div>
            </div>
            <div id="pareto-scatter" class="chart-box"></div>
          </div>

          <!-- Radar comparison -->
          <div class="card" v-if="compareList.length > 0 && paretoData">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
              <div class="card-title" style="margin-bottom:0">Course Comparison ({{ compareList.length }})</div>
              <button class="btn btn-sm" style="background:var(--bg3);color:var(--text2);width:auto" @click="compareList = []">Clear</button>
            </div>
            <div id="radar-compare" class="chart-box"></div>
          </div>

          <div class="card" v-if="paretoData">
            <div class="card-title">Options Table <span style="font-size:0.65rem;color:var(--text3);text-transform:none;letter-spacing:0">(click row for detail, shift+click to compare)</span></div>
            <table class="tbl">
              <thead>
                <tr>
                  <th style="width:30px"></th>
                  <th>Course</th><th>Status</th>
                  <th v-for="k in paretoData.objective_keys" :key="k" v-text="k"></th>
                  <th>Drift</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="opt in sortedParetoOptions" :key="opt.option_id"
                    @click.exact="selectCourse(opt)" @click.shift="toggleCompare(opt)"
                    style="cursor:pointer"
                    :style="selectedOption && selectedOption.option_id === opt.option_id ? 'background:var(--bg3)' : ''">
                  <td><input type="checkbox" :checked="compareList.some(c => c.option_id === opt.option_id)" @click.stop="toggleCompare(opt)" style="accent-color:var(--accent)"></td>
                  <td class="mono" v-text="opt.option_id.replace('course:','')"></td>
                  <td>
                    <span v-if="opt.is_pareto" class="tag tag-pareto">Pareto</span>
                    <span v-else-if="!opt.feasible" class="tag tag-infeasible">Infeasible</span>
                    <span v-else class="tag tag-feasible">OK</span>
                  </td>
                  <td v-for="k in paretoData.objective_keys" :key="k" class="mono"
                      v-text="(opt.objectives[k] || 0).toFixed(3)"></td>
                  <td class="mono" v-text="opt.autonomy_drift.toFixed(3)"></td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Detail panel -->
          <div class="card" v-if="selectedOption && paretoData" style="border-color:var(--accent)">
            <div class="card-title">Course Detail</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
              <div>
                <p style="font-size:0.8rem;margin-bottom:8px"><strong>ID:</strong> <span class="mono" v-text="selectedOption.option_id"></span></p>
                <p style="font-size:0.8rem;margin-bottom:8px"><strong>Status:</strong>
                  <span v-if="selectedOption.is_pareto" class="tag tag-pareto">Pareto Optimal</span>
                  <span v-else-if="!selectedOption.feasible" class="tag tag-infeasible">Infeasible</span>
                  <span v-else class="tag tag-feasible">Feasible</span>
                </p>
                <p style="font-size:0.8rem;margin-bottom:8px"><strong>Autonomy Drift:</strong> <span class="mono" v-text="selectedOption.autonomy_drift.toFixed(4)"></span></p>
                <div v-for="k in paretoData.objective_keys" :key="k" class="comp-bar-wrap">
                  <div class="comp-bar-label">
                    <span v-text="k"></span>
                    <span class="mono" v-text="(selectedOption.objectives[k] || 0).toFixed(3)"></span>
                  </div>
                  <div class="comp-bar-track">
                    <div class="comp-bar-fill" :style="{ width: ((selectedOption.objectives[k] || 0) * 100) + '%', background: barColor(selectedOption.objectives[k] || 0) }"></div>
                  </div>
                </div>
              </div>
              <div id="detail-radar" style="min-height:250px"></div>
            </div>
          </div>
        </template>

      </div>
    </div>
  </div>
</div>

<script>
const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;

createApp({
  setup() {
    const currentTab = ref('dashboard');
    const apiStatus = ref('checking...');

    const tabs = [
      { id: 'dashboard', label: 'Dashboard', icon: '\u2302' },
      { id: 'network', label: 'Program Network', icon: '\u2B95' },
      { id: 'dag', label: 'Course DAG', icon: '\u2726' },
      { id: 'pareto', label: 'Pareto Explorer', icon: '\u2605' },
    ];

    const activeTab = computed(() => tabs.find(t => t.id === currentTab.value) || tabs[0]);

    // ── Plotly dark layout helper ──
    const darkLayout = { paper_bgcolor: '#1e293b', plot_bgcolor: '#0f172a', font: { color: '#f1f5f9' } };

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // DASHBOARD
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const dashStats = ref(null);
    const dashProgramData = ref(null); // from /graph/programs

    async function loadDashboard() {
      try {
        const [statsResp, progsResp] = await Promise.all([
          fetch('/graph/stats'),
          fetch('/graph/programs'),
        ]);
        if (statsResp.ok) dashStats.value = await statsResp.json();
        if (progsResp.ok) dashProgramData.value = await progsResp.json();
        await nextTick();
        renderDashCharts();
      } catch (e) { console.error('Dashboard load error:', e); }
    }

    function renderDashCharts() {
      if (!dashStats.value) return;
      const s = dashStats.value;

      // Competency donut
      const compTypes = Object.keys(s.competency_distribution);
      const compVals = compTypes.map(k => s.competency_distribution[k]);
      const compColors = { '\u0423\u041A': '#3b82f6', '\u041E\u041F\u041A': '#22c55e', '\u041F\u041A': '#a855f7' };
      Plotly.newPlot('dash-comp-chart', [{
        labels: compTypes, values: compVals, type: 'pie', hole: 0.45,
        marker: { colors: compTypes.map(t => compColors[t] || '#64748b') },
        textinfo: 'label+value+percent', textfont: { color: '#f1f5f9', size: 12 },
      }], { ...darkLayout, showlegend: false, margin: { t: 20, r: 20, b: 20, l: 20 } }, { responsive: true });

      // Programs bar chart (top 15 by edge count)
      if (dashProgramData.value) {
        const progs = dashProgramData.value.slice(0, 15);
        Plotly.newPlot('dash-programs-chart', [{
          x: progs.map(p => p.fgos_code),
          y: progs.map(p => p.edge_count),
          type: 'bar',
          marker: { color: '#3b82f6', line: { width: 0 } },
          hovertemplate: '%{x}<br>%{y} edges<extra></extra>',
        }], {
          ...darkLayout,
          xaxis: { color: '#94a3b8', gridcolor: '#1e293b', tickangle: -45, tickfont: { size: 10 } },
          yaxis: { title: 'Prerequisite Edges', color: '#94a3b8', gridcolor: '#1e293b' },
          margin: { t: 10, r: 10, b: 80, l: 50 },
        }, { responsive: true });
      }

      // Courses per year
      const years = Object.keys(s.courses_per_year);
      const yearCounts = years.map(y => s.courses_per_year[y]);
      Plotly.newPlot('dash-year-chart', [{
        x: years, y: yearCounts, type: 'bar',
        marker: { color: '#06b6d4' },
        hovertemplate: '%{x}: %{y} courses<extra></extra>',
      }], {
        ...darkLayout,
        xaxis: { title: 'Year', color: '#94a3b8', gridcolor: '#1e293b' },
        yaxis: { title: 'Unique Courses', color: '#94a3b8', gridcolor: '#1e293b' },
        margin: { t: 10, r: 10, b: 50, l: 50 },
      }, { responsive: true });

      // Temporal changes
      const changeTypes = Object.keys(s.temporal_changes);
      const changeVals = changeTypes.map(k => s.temporal_changes[k]);
      const changeColors = { 'new': '#22c55e', 'modified': '#f97316', 'unchanged': '#64748b', 'removed': '#ef4444' };
      Plotly.newPlot('dash-temporal-chart', [{
        labels: changeTypes, values: changeVals, type: 'pie', hole: 0.4,
        marker: { colors: changeTypes.map(t => changeColors[t] || '#94a3b8') },
        textinfo: 'label+value', textfont: { color: '#f1f5f9', size: 12 },
      }], { ...darkLayout, showlegend: false, margin: { t: 20, r: 20, b: 20, l: 20 } }, { responsive: true });
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // PROGRAM NETWORK
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const networkYear = ref('');
    const networkYears = ref(['2024', '2025']);
    const networkLayout = ref('cose');
    const networkStats = ref(null);
    const networkSelectedProgram = ref(null);
    const networkSelectedEdges = ref([]);
    let cyNetwork = null;

    // Color map for area prefixes
    const areaColors = { '01': '#3b82f6', '03': '#22c55e', '09': '#a855f7', '11': '#eab308', '13': '#ef4444',
      '22': '#f97316', '28': '#06b6d4', '38': '#ec4899' };

    async function loadNetwork() {
      try {
        let url = '/graph/network';
        if (networkYear.value) url += `?year=${networkYear.value}`;
        const resp = await fetch(url);
        if (!resp.ok) return;
        const data = await resp.json();
        networkStats.value = data.stats;
        // Extract years from nodes
        const yrs = new Set();
        data.elements.nodes.forEach(n => (n.data.years || []).forEach(y => yrs.add(y)));
        if (yrs.size > 0) networkYears.value = [...yrs].sort();
        networkSelectedProgram.value = null;
        networkSelectedEdges.value = [];
        await nextTick();
        renderNetwork(data.elements);
      } catch (e) { console.error('Network load error:', e); }
    }

    function renderNetwork(elements) {
      const container = document.getElementById('cy-network');
      if (!container) return;
      if (cyNetwork) { cyNetwork.destroy(); cyNetwork = null; }

      // Find max course_count for sizing
      const maxCourses = Math.max(...elements.nodes.map(n => n.data.course_count || 1), 1);
      const maxShared = Math.max(...elements.edges.map(e => e.data.shared_count || 1), 1);

      cyNetwork = cytoscape({
        container,
        elements: { nodes: elements.nodes, edges: elements.edges },
        style: [
          {
            selector: 'node',
            style: {
              'label': 'data(label)',
              'font-size': '10px',
              'color': '#f1f5f9',
              'text-outline-color': '#0f172a',
              'text-outline-width': 2,
              'text-valign': 'bottom',
              'text-margin-y': 4,
              'background-color': function(ele) {
                const prefix = ele.data().area_prefix || '';
                return areaColors[prefix] || '#06b6d4';
              },
              'width': function(ele) {
                const count = ele.data().course_count || 1;
                return 20 + (count / maxCourses) * 40;
              },
              'height': function(ele) {
                const count = ele.data().course_count || 1;
                return 20 + (count / maxCourses) * 40;
              },
              'border-width': 2,
              'border-color': '#1e293b',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) {
                const count = ele.data().shared_count || 1;
                return 1 + (count / maxShared) * 6;
              },
              'line-color': '#475569',
              'opacity': 0.5,
              'curve-style': 'bezier',
            }
          },
          {
            selector: 'node:selected',
            style: { 'border-width': 3, 'border-color': '#f1f5f9' }
          },
          {
            selector: '.highlighted',
            style: { 'opacity': 1, 'border-color': '#f1f5f9', 'border-width': 3 }
          },
          {
            selector: 'edge.highlighted',
            style: { 'line-color': '#f97316', 'opacity': 1 }
          },
          {
            selector: '.faded',
            style: { 'opacity': 0.1 }
          }
        ],
        layout: getNetworkLayoutConfig(),
        minZoom: 0.3, maxZoom: 3,
      });

      cyNetwork.on('tap', 'node', function(evt) {
        const node = evt.target;
        networkSelectedProgram.value = node.data();

        // Find edges connected to this node
        const connectedEdges = node.connectedEdges();
        const edgeInfo = [];
        connectedEdges.forEach(e => {
          const d = e.data();
          const other = d.source === node.id() ? d.target : d.source;
          edgeInfo.push({ target: other, shared_count: d.shared_count });
        });
        edgeInfo.sort((a, b) => b.shared_count - a.shared_count);
        networkSelectedEdges.value = edgeInfo;

        // Highlight
        cyNetwork.elements().removeClass('highlighted faded');
        const neighborhood = node.neighborhood().union(node);
        cyNetwork.elements().addClass('faded');
        neighborhood.removeClass('faded').addClass('highlighted');
      });

      cyNetwork.on('tap', function(evt) {
        if (evt.target === cyNetwork) {
          cyNetwork.elements().removeClass('highlighted faded');
          networkSelectedProgram.value = null;
          networkSelectedEdges.value = [];
        }
      });
    }

    function getNetworkLayoutConfig() {
      const l = networkLayout.value;
      if (l === 'cose') return { name: 'cose', animate: false, nodeOverlap: 30, idealEdgeLength: 120, gravity: 0.3 };
      if (l === 'concentric') return { name: 'concentric', animate: false, minNodeSpacing: 50 };
      return { name: 'circle', animate: false };
    }

    function applyNetworkLayout() {
      if (!cyNetwork) return;
      cyNetwork.layout(getNetworkLayoutConfig()).run();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // COURSE DAG
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const dagPrograms = ref([]);
    const dagProgram = ref('');
    const dagYear = ref('');
    const dagYears = ref(['2024', '2025']);
    const dagCompare = ref(false);
    const dagYearA = ref('2024');
    const dagYearB = ref('2025');
    const dagLayout = ref('dagre');
    const dagStats = ref(null);
    const dagSelectedNode = ref(null);
    let cyDag = null;

    async function loadDagPrograms() {
      try {
        const resp = await fetch('/graph/programs');
        if (resp.ok) {
          dagPrograms.value = await resp.json();
          const yrs = new Set();
          dagPrograms.value.forEach(p => p.years.forEach(y => yrs.add(y)));
          dagYears.value = [...yrs].sort();
        }
      } catch (e) { console.error('Failed to load DAG programs:', e); }
    }

    async function loadDag() {
      if (!dagProgram.value) return;
      dagSelectedNode.value = null;

      try {
        let url, data;
        if (dagCompare) {
          url = `/graph/temporal-diff?fgos_code=${encodeURIComponent(dagProgram.value)}&year_a=${dagYearA.value}&year_b=${dagYearB.value}`;
          const resp = await fetch(url);
          if (!resp.ok) return;
          data = await resp.json();
        } else {
          url = `/graph/prerequisites?fgos_code=${encodeURIComponent(dagProgram.value)}`;
          if (dagYear.value) url += `&year=${dagYear.value}`;
          const resp = await fetch(url);
          if (!resp.ok) return;
          data = await resp.json();
        }

        dagStats.value = data.stats;
        await nextTick();
        renderDag(data.elements, dagCompare);
      } catch (e) { console.error('Failed to load DAG:', e); }
    }

    function renderDag(elements, isCompare) {
      const container = document.getElementById('cy-dag');
      if (!container) return;
      if (cyDag) { cyDag.destroy(); cyDag = null; }

      const changeColors = { 'new': '#22c55e', 'modified': '#f97316', 'stable': '#64748b', 'unchanged': '#64748b', 'removed': '#ef4444', 'unknown': '#475569' };

      cyDag = cytoscape({
        container,
        elements: { nodes: elements.nodes, edges: elements.edges },
        style: [
          {
            selector: 'node',
            style: {
              'label': 'data(label)',
              'font-size': '9px',
              'text-wrap': 'ellipsis',
              'text-max-width': '100px',
              'color': '#f1f5f9',
              'text-outline-color': '#0f172a',
              'text-outline-width': 1.5,
              'background-color': function(ele) {
                const d = ele.data();
                if (isCompare && d.change_type) {
                  return changeColors[d.change_type] || '#475569';
                }
                if (d.in_degree + d.out_degree >= 8) return '#eab308';
                if (d.is_root) return '#22c55e';
                if (d.is_leaf) return '#a855f7';
                return '#3b82f6';
              },
              'width': function(ele) {
                return Math.max(20, Math.min(50, 15 + (ele.data().in_degree + ele.data().out_degree) * 3));
              },
              'height': function(ele) {
                return Math.max(20, Math.min(50, 15 + (ele.data().in_degree + ele.data().out_degree) * 3));
              },
              'border-width': function(ele) {
                if (isCompare && ele.data().change_type === 'removed') return 2;
                return 1.5;
              },
              'border-color': function(ele) {
                if (isCompare && ele.data().change_type === 'removed') return '#ef4444';
                return '#334155';
              },
              'border-style': function(ele) {
                if (isCompare && ele.data().change_type === 'removed') return 'dashed';
                return 'solid';
              },
            }
          },
          {
            selector: 'edge',
            style: {
              'width': 1.5,
              'line-color': '#475569',
              'target-arrow-color': '#475569',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'arrow-scale': 0.8,
              'opacity': 0.7,
            }
          },
          {
            selector: 'node:selected',
            style: { 'border-width': 3, 'border-color': '#f1f5f9' }
          },
          {
            selector: '.highlighted',
            style: {
              'opacity': 1,
              'border-color': '#f1f5f9',
              'border-width': 3,
            }
          },
          {
            selector: 'edge.highlighted',
            style: {
              'line-color': '#ef4444',
              'target-arrow-color': '#ef4444',
              'opacity': 1,
              'width': 2.5,
            }
          },
          {
            selector: '.faded',
            style: { 'opacity': 0.15 }
          }
        ],
        layout: getDagLayoutConfig(),
        minZoom: 0.2, maxZoom: 3,
      });

      cyDag.on('tap', 'node', function(evt) {
        const node = evt.target;
        dagSelectedNode.value = node.data();

        cyDag.elements().removeClass('highlighted faded');
        const predecessors = node.predecessors();
        const successors = node.successors();
        const neighborhood = predecessors.union(successors).union(node);
        cyDag.elements().addClass('faded');
        neighborhood.removeClass('faded').addClass('highlighted');
      });

      cyDag.on('tap', function(evt) {
        if (evt.target === cyDag) {
          cyDag.elements().removeClass('highlighted faded');
          dagSelectedNode.value = null;
        }
      });
    }

    function getDagLayoutConfig() {
      const l = dagLayout.value;
      if (l === 'dagre') return { name: 'dagre', rankDir: 'TB', nodeSep: 40, rankSep: 60, animate: false };
      if (l === 'breadthfirst') return { name: 'breadthfirst', directed: true, spacingFactor: 1.2, animate: false };
      return { name: 'cose', animate: false, nodeOverlap: 20, idealEdgeLength: 80 };
    }

    function applyDagLayout() {
      if (!cyDag) return;
      cyDag.layout(getDagLayoutConfig()).run();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // PARETO EXPLORER (preserved from original)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const objectiveOptions = ['market', 'mission', 'university', 'learner'];
    const paretoConfig = ref({ objectives: ['market', 'mission', 'university', 'learner'], tau: 0.25, lens: 'identity', embedding: 'stub' });
    const paretoData = ref(null);
    const paretoLoading = ref(false);
    const selectedOption = ref(null);
    const paretoView = ref('2d');
    const compareList = ref([]);

    const sortedParetoOptions = computed(() => {
      if (!paretoData.value) return [];
      const opts = [...paretoData.value.options];
      const keys = paretoData.value.objective_keys;
      opts.sort((a, b) => {
        if (a.is_pareto !== b.is_pareto) return b.is_pareto - a.is_pareto;
        return (b.objectives[keys[0]] || 0) - (a.objectives[keys[0]] || 0);
      });
      return opts;
    });

    function selectCourse(opt) {
      selectedOption.value = opt;
      nextTick(() => renderDetailRadar(opt));
    }

    function toggleCompare(opt) {
      const idx = compareList.value.findIndex(c => c.option_id === opt.option_id);
      if (idx >= 0) { compareList.value.splice(idx, 1); }
      else if (compareList.value.length < 6) { compareList.value.push(opt); }
      nextTick(() => renderCompareRadar());
    }

    async function loadPareto() {
      paretoLoading.value = true;
      try {
        const resp = await fetch('/dashboard/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            objectives: paretoConfig.value.objectives,
            autonomy_tau: paretoConfig.value.tau,
            lens_mode: paretoConfig.value.lens,
            embedding_kind: paretoConfig.value.embedding,
            topk: 20
          })
        });
        paretoData.value = await resp.json();
        compareList.value = [];
        selectedOption.value = null;
        await nextTick();
        renderParetoChart();
      } catch (e) { console.error('Pareto load error:', e); }
      paretoLoading.value = false;
    }

    function renderParetoChart() {
      const d = paretoData.value;
      if (!d || d.objective_keys.length < 2) return;
      const keys = d.objective_keys;
      const pareto = d.options.filter(o => o.is_pareto);
      const other = d.options.filter(o => !o.is_pareto);

      if (paretoView.value === '3d' && keys.length >= 3) {
        const xk = keys[0], yk = keys[1], zk = keys[2];
        const traces = [
          { x: other.map(o => o.objectives[xk]||0), y: other.map(o => o.objectives[yk]||0), z: other.map(o => o.objectives[zk]||0),
            text: other.map(o => o.option_id), mode: 'markers', type: 'scatter3d', name: 'Other',
            marker: { size: 4, color: other.map(o => o.feasible ? '#475569' : '#f87171'), opacity: 0.7 } },
          { x: pareto.map(o => o.objectives[xk]||0), y: pareto.map(o => o.objectives[yk]||0), z: pareto.map(o => o.objectives[zk]||0),
            text: pareto.map(o => o.option_id), mode: 'markers', type: 'scatter3d', name: 'Pareto',
            marker: { size: 7, color: '#22c55e', symbol: 'diamond', opacity: 1, line: { width: 1, color: '#166534' } } }
        ];
        const layout = { ...darkLayout, scene: {
            xaxis: { title: xk, color: '#94a3b8', gridcolor: '#1e293b', backgroundcolor: '#0f172a' },
            yaxis: { title: yk, color: '#94a3b8', gridcolor: '#1e293b', backgroundcolor: '#0f172a' },
            zaxis: { title: zk, color: '#94a3b8', gridcolor: '#1e293b', backgroundcolor: '#0f172a' },
            bgcolor: '#0f172a' },
          showlegend: true, legend: { x: 0, y: 1.1, orientation: 'h' }, margin: { t: 20, r: 10, b: 10, l: 10 } };
        Plotly.newPlot('pareto-scatter', traces, layout, { responsive: true });

      } else if (paretoView.value === 'parallel') {
        const allOpts = d.options;
        const dims = keys.map(k => ({
          label: k, values: allOpts.map(o => o.objectives[k] || 0), range: [0, 1]
        }));
        dims.push({ label: 'drift', values: allOpts.map(o => o.autonomy_drift), range: [0, 0.5] });
        const colorVals = allOpts.map(o => o.is_pareto ? 1 : 0);
        const traces = [{ type: 'parcoords', line: { color: colorVals, colorscale: [[0, '#475569'], [1, '#22c55e']], showscale: false }, dimensions: dims }];
        const layout = { ...darkLayout, margin: { t: 40, r: 40, b: 30, l: 40 } };
        Plotly.newPlot('pareto-scatter', traces, layout, { responsive: true });

      } else {
        const xk = keys[0], yk = keys[1];
        const traces = [
          { x: other.map(o => o.objectives[xk]||0), y: other.map(o => o.objectives[yk]||0),
            text: other.map(o => o.option_id), mode: 'markers', name: 'Other',
            marker: { size: 9, color: other.map(o => o.feasible ? '#475569' : '#f87171'), line: { width: 1, color: '#334155' } },
            hovertemplate: '%{text}<br>'+xk+': %{x:.3f}<br>'+yk+': %{y:.3f}<extra></extra>' },
          { x: pareto.map(o => o.objectives[xk]||0), y: pareto.map(o => o.objectives[yk]||0),
            text: pareto.map(o => o.option_id), mode: 'markers', name: 'Pareto',
            marker: { size: 13, color: '#22c55e', symbol: 'star', line: { width: 2, color: '#166534' } },
            hovertemplate: '%{text}<br>'+xk+': %{x:.3f}<br>'+yk+': %{y:.3f}<extra></extra>' }
        ];
        const layout = { ...darkLayout, xaxis: { title: xk, color: '#94a3b8', gridcolor: '#1e293b' },
          yaxis: { title: yk, color: '#94a3b8', gridcolor: '#1e293b' },
          showlegend: true, legend: { x: 0, y: 1.1, orientation: 'h' }, margin: { t: 30, r: 20, b: 50, l: 60 } };
        Plotly.newPlot('pareto-scatter', traces, layout, { responsive: true });
      }
    }

    function renderDetailRadar(opt) {
      const d = paretoData.value;
      if (!d || !opt) return;
      const el = document.getElementById('detail-radar');
      if (!el) return;
      const keys = d.objective_keys;
      const vals = keys.map(k => opt.objectives[k] || 0);
      const traces = [{ type: 'scatterpolar', r: [...vals, vals[0]], theta: [...keys, keys[0]],
        fill: 'toself', fillcolor: 'rgba(59,130,246,0.2)', line: { color: '#3b82f6', width: 2 },
        name: opt.option_id.replace('course:','') }];
      const layout = { polar: { bgcolor: '#0f172a', radialaxis: { visible: true, range: [0, 1], color: '#64748b', gridcolor: '#1e293b' },
        angularaxis: { color: '#94a3b8' } }, paper_bgcolor: '#1e293b', font: { color: '#f1f5f9', size: 11 },
        showlegend: false, margin: { t: 30, r: 30, b: 30, l: 30 }, height: 250 };
      Plotly.newPlot(el, traces, layout, { responsive: true });
    }

    function renderCompareRadar() {
      const d = paretoData.value;
      if (!d || compareList.value.length === 0) return;
      const el = document.getElementById('radar-compare');
      if (!el) return;
      const keys = d.objective_keys;
      const colors = ['#3b82f6', '#22c55e', '#a855f7', '#eab308', '#ef4444', '#06b6d4'];
      const traces = compareList.value.map((opt, i) => {
        const vals = keys.map(k => opt.objectives[k] || 0);
        return { type: 'scatterpolar', r: [...vals, vals[0]], theta: [...keys, keys[0]],
          fill: 'toself', fillcolor: colors[i % colors.length] + '22',
          line: { color: colors[i % colors.length], width: 2 },
          name: opt.option_id.replace('course:','') };
      });
      const layout = { polar: { bgcolor: '#0f172a', radialaxis: { visible: true, range: [0, 1], color: '#64748b', gridcolor: '#1e293b' },
        angularaxis: { color: '#94a3b8' } }, paper_bgcolor: '#1e293b', font: { color: '#f1f5f9', size: 11 },
        showlegend: true, legend: { x: 0.5, xanchor: 'center', y: -0.1, orientation: 'h' }, margin: { t: 40, r: 40, b: 60, l: 40 } };
      Plotly.newPlot(el, traces, layout, { responsive: true });
    }

    // ── Helpers ──
    function barColor(val) {
      if (val >= 0.7) return 'var(--green)';
      if (val >= 0.4) return 'var(--yellow)';
      return 'var(--red)';
    }

    // ── Tab change watchers ──
    watch(currentTab, (val) => {
      if (val === 'network' && !networkStats.value) {
        loadNetwork();
      }
      if (val === 'dag' && dagPrograms.value.length === 0) {
        loadDagPrograms();
      }
    });

    // ── Init ──
    onMounted(async () => {
      try {
        const resp = await fetch('/health');
        if (resp.ok) { apiStatus.value = 'connected'; }
        else { apiStatus.value = 'error'; }
      } catch (e) { apiStatus.value = 'offline'; }

      // Auto-load dashboard
      loadDashboard();
    });

    return {
      currentTab, apiStatus, tabs, activeTab,
      // Dashboard
      dashStats, loadDashboard,
      // Network
      networkYear, networkYears, networkLayout, networkStats,
      networkSelectedProgram, networkSelectedEdges,
      loadNetwork, applyNetworkLayout,
      // DAG
      dagPrograms, dagProgram, dagYear, dagYears, dagCompare, dagYearA, dagYearB,
      dagLayout, dagStats, dagSelectedNode,
      loadDagPrograms, loadDag, applyDagLayout,
      // Pareto
      objectiveOptions, paretoConfig, paretoData, paretoLoading, selectedOption, sortedParetoOptions, loadPareto,
      paretoView, compareList, selectCourse, toggleCompare, renderParetoChart,
      barColor,
    };
  }
}).mount('#app');
</script>
</body>
</html>
