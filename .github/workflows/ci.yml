name: CI

on:
  push:
    branches: [main, "kt*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,exp]"
      - name: Run tests
        run: >
          pytest tests/ -q
          --ignore=tests/test_ocw_ingest.py
          --ignore=tests/test_strict_data.py
          --tb=short
          -x

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,exp]"
      - name: Smoke test (toy + stub)
        run: python -m experiments.run dataset=toy embedding=stub lenses=identity
