dataset:
  id: asu
  description: ASU First Destination Survey + career outcomes dataset.
  manifest_path: data/manifests/asu_sources.yaml
  artifacts_path: data/processed/asu/artifacts.jsonl
embedding:
  kind: stub
  d: 64
lenses:
  mode: identity
objectives:
  enabled:
  - market
  - mission
  - university
  - learner
constraints:
  enable_ethics: true
  autonomy_drift_tau: 0.25
planning:
  depth: 2
  topk: 5
outputs:
  base_dir: experiments/reports
  run_id: auto
seed: 42
